<!doctype html>
<html lang="no" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sirkulasjon Venndiagram</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    * {
      font-family: 'Nunito', sans-serif;
    }
    .venn-circle {
      transition: all 0.3s ease;
    }
    .venn-circle:hover {
      transform: scale(1.02);
    }
    .info-item {
      animation: fadeIn 0.5s ease forwards;
      opacity: 0;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    .fish-circle {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.85) 0%, rgba(37, 99, 235, 0.9) 100%);
    }
    .worm-circle {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.85) 0%, rgba(225, 29, 72, 0.9) 100%);
    }
    .overlap-area {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.95) 0%, rgba(124, 58, 237, 0.95) 100%);
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full m-0 overflow-auto">
  <div id="app-wrapper" class="min-h-full w-full bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-4 md:p-8"><!-- Decorative bubbles -->
   <div class="bubble w-4 h-4 top-10 left-10" style="animation-delay: 0s;"></div>
   <div class="bubble w-6 h-6 top-20 right-20" style="animation-delay: 1s;"></div>
   <div class="bubble w-3 h-3 bottom-20 left-1/4" style="animation-delay: 2s;"></div><!-- Header -->
   <div class="text-center mb-6 md:mb-10">
    <h1 id="main-title" class="text-2xl md:text-4xl font-extrabold text-white mb-2 tracking-tight">🐟 Sirkulasjon: Fisk vs Meitemark 🪱</h1>
    <p class="text-slate-400 text-sm md:text-base">Klikk på områdene for å lære mer</p>
   </div><!-- Venn Diagram Container -->
   <div class="relative max-w-4xl mx-auto h-80 md:h-96 mb-8"><!-- Fish Circle (Left) -->
    <div id="fish-circle" class="venn-circle fish-circle absolute left-0 md:left-8 w-52 h-52 md:w-72 md:h-72 rounded-full cursor-pointer shadow-2xl shadow-blue-500/30 flex items-center justify-center z-10" onclick="showInfo('fish')">
     <div class="text-center px-4 md:px-8 pr-8 md:pr-16"><span class="text-3xl md:text-5xl mb-2 block">🐟</span>
      <h3 id="fish-title" class="text-white font-bold text-lg md:text-xl mb-1">Fisk</h3>
      <p class="text-blue-100 text-xs md:text-sm opacity-90">Kun fisk</p>
     </div>
    </div><!-- Worm Circle (Right) -->
    <div id="worm-circle" class="venn-circle worm-circle absolute right-0 md:right-8 w-52 h-52 md:w-72 md:h-72 rounded-full cursor-pointer shadow-2xl shadow-rose-500/30 flex items-center justify-center z-10" onclick="showInfo('worm')">
     <div class="text-center px-4 md:px-8 pl-8 md:pl-16"><span class="text-3xl md:text-5xl mb-2 block">🪱</span>
      <h3 id="worm-title" class="text-white font-bold text-lg md:text-xl mb-1">Meitemark</h3>
      <p class="text-rose-100 text-xs md:text-sm opacity-90">Kun meitemark</p>
     </div>
    </div><!-- Overlap Area -->
    <div class="overlap-area absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-28 h-52 md:w-36 md:h-72 rounded-full cursor-pointer shadow-2xl shadow-violet-500/40 flex items-center justify-center z-20" onclick="showInfo('both')">
     <div class="text-center px-2"><span class="text-2xl md:text-3xl mb-1 block">✨</span>
      <h3 class="text-white font-bold text-sm md:text-base mb-1">Felles</h3>
      <p class="text-violet-100 text-xs opacity-90">Begge har</p>
     </div>
    </div>
   </div><!-- Info Display -->
   <div id="info-display" class="max-w-3xl mx-auto bg-slate-800/80 backdrop-blur-sm rounded-2xl p-5 md:p-8 border border-slate-700 shadow-xl min-h-48">
    <div id="info-content" class="text-center">
     <p class="text-slate-400 text-base md:text-lg">👆 Klikk på et område i diagrammet for å se informasjon</p>
    </div>
   </div><!-- Legend -->
   <div class="flex flex-wrap justify-center gap-4 md:gap-8 mt-6 md:mt-8">
    <div class="flex items-center gap-2">
     <div class="w-4 h-4 md:w-5 md:h-5 rounded-full bg-blue-500"></div><span class="text-slate-300 text-sm md:text-base">Kun fisk</span>
    </div>
    <div class="flex items-center gap-2">
     <div class="w-4 h-4 md:w-5 md:h-5 rounded-full bg-violet-500"></div><span class="text-slate-300 text-sm md:text-base">Felles</span>
    </div>
    <div class="flex items-center gap-2">
     <div class="w-4 h-4 md:w-5 md:h-5 rounded-full bg-rose-500"></div><span class="text-slate-300 text-sm md:text-base">Kun meitemark</span>
    </div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      main_title: '🐟 Sirkulasjon: Fisk vs Meitemark 🪱',
      fish_title: 'Fisk',
      worm_title: 'Meitemark',
      background_color: '#0f172a',
      text_color: '#f8fafc',
      fish_color: '#3b82f6',
      worm_color: '#f43f5e',
      overlap_color: '#8b5cf6'
    };

    const infoData = {
      fish: {
        title: '🐟 Sirkulasjon hos Fisk',
        emoji: '🐟',
        color: 'blue',
        items: [
          { icon: '❤️', text: '<strong>Enkelt hjerte</strong> – kun ett atrium og én ventrikkel' },
          { icon: '🔴', text: '<strong>Lukket kretsløp</strong> – blodet strømmer i blodårer' },
          { icon: '🫁', text: '<strong>Gjeller</strong> – gassutveksling skjer i gjellene' },
          { icon: '➡️', text: '<strong>Enkel sirkulasjon</strong> – blodet passerer hjertet én gang per runde' },
          { icon: '🩸', text: '<strong>Hemoglobin</strong> i røde blodceller for oksygentransport' },
          { icon: '❄️', text: '<strong>Kaldblodige</strong> – kroppstemperatur følger omgivelsene' }
        ]
      },
      worm: {
        title: '🪱 Sirkulasjon hos Meitemark',
        emoji: '🪱',
        color: 'rose',
        items: [
          { icon: '💜', text: '<strong>Fem "hjerter"</strong> – aortabuer som pumper blod' },
          { icon: '🔴', text: '<strong>Lukket kretsløp</strong> – blodet strømmer i blodårer' },
          { icon: '🌬️', text: '<strong>Hudpusting</strong> – gassutveksling gjennom fuktig hud' },
          { icon: '🔄', text: '<strong>Dorsal og ventral blodåre</strong> – hovedårene i kroppen' },
          { icon: '🩸', text: '<strong>Hemoglobin</strong> fritt oppløst i blodet (ikke i celler)' },
          { icon: '🌡️', text: '<strong>Kaldblodige</strong> – kroppstemperatur følger omgivelsene' }
        ]
      },
      both: {
        title: '✨ Felles for Begge',
        emoji: '🤝',
        color: 'violet',
        items: [
          { icon: '🔴', text: '<strong>Lukket sirkulasjonssystem</strong> – blodet er alltid inne i blodårer' },
          { icon: '🩸', text: '<strong>Bruker hemoglobin</strong> – oksygenbærende protein' },
          { icon: '💪', text: '<strong>Pumpe</strong> – har organ(er) som pumper blodet rundt' },
          { icon: '🔄', text: '<strong>Transport</strong> – frakter næring, oksygen og avfallsstoffer' },
          { icon: '❄️', text: '<strong>Vekselvarme</strong> – begge er kaldblodige dyr' },
          { icon: '🌊', text: '<strong>Væskebasert</strong> – blodet er et flytende transportmedium' }
        ]
      }
    };

    function showInfo(type) {
      const data = infoData[type];
      const content = document.getElementById('info-content');
      
      const colorClasses = {
        blue: 'from-blue-500 to-blue-600',
        rose: 'from-rose-500 to-rose-600',
        violet: 'from-violet-500 to-violet-600'
      };

      let html = `
        <div class="text-center mb-5">
          <span class="text-4xl md:text-5xl">${data.emoji}</span>
          <h2 class="text-xl md:text-2xl font-bold text-white mt-2 bg-gradient-to-r ${colorClasses[data.color]} bg-clip-text text-transparent">
            ${data.title}
          </h2>
        </div>
        <ul class="space-y-3 text-left max-w-xl mx-auto">
      `;

      data.items.forEach((item, index) => {
        html += `
          <li class="info-item flex items-start gap-3 text-slate-200 text-sm md:text-base" style="animation-delay: ${index * 0.1}s">
            <span class="text-lg md:text-xl flex-shrink-0">${item.icon}</span>
            <span>${item.text}</span>
          </li>
        `;
      });

      html += '</ul>';
      content.innerHTML = html;
    }

    async function onConfigChange(config) {
      document.getElementById('main-title').textContent = config.main_title || defaultConfig.main_title;
      document.getElementById('fish-title').textContent = config.fish_title || defaultConfig.fish_title;
      document.getElementById('worm-title').textContent = config.worm_title || defaultConfig.worm_title;
      
      document.getElementById('app-wrapper').style.background = `linear-gradient(to bottom right, ${config.background_color || defaultConfig.background_color}, #1e293b, ${config.background_color || defaultConfig.background_color})`;
      document.getElementById('main-title').style.color = config.text_color || defaultConfig.text_color;
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => { config.background_color = value; window.elementSdk.setConfig({ background_color: value }); }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => { config.text_color = value; window.elementSdk.setConfig({ text_color: value }); }
          }
        ],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ['main_title', config.main_title || defaultConfig.main_title],
        ['fish_title', config.fish_title || defaultConfig.fish_title],
        ['worm_title', config.worm_title || defaultConfig.worm_title]
      ]);
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>

</html>
